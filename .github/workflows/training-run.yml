name: Training Run

on:
  schedule:
    - cron: '32 5 * * *' # daily, offset from the other profile workflows
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Generate training-run.svg from real contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/training_run.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training-run.svg
          git diff --cached --quiet || { git commit -m "Update training run"; git push; }
